<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>김시선 | 1oz0</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Apple SD Gothic Neo", "Malgun Gothic", "Segoe UI", sans-serif;
      background: #fafafa;
      color: #222;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: #fff;
      border: 1px solid #e5e5e5;
      border-radius: 12px;
      padding: 48px 40px;
      max-width: 420px;
      width: 100%;
    }

    h1 {
      font-size: 28px;
      font-weight: 700;
    }

    .nickname {
      color: #888;
      font-size: 15px;
      margin-top: 4px;
      margin-bottom: 32px;
    }

    dl {
      display: grid;
      grid-template-columns: 80px 1fr;
      row-gap: 16px;
      font-size: 15px;
      line-height: 1.6;
    }

    dt {
      color: #999;
      font-weight: 500;
    }

    dd {
      color: #333;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>김시선</h1>
    <p class="nickname">@1oz0</p>
    <dl>
      <dt>관심 분야</dt>
      <dd>자율주행, 컴퓨터 비전, 멀티모달</dd>
      <dt>취미</dt>
      <dd>런닝 &amp; 여행</dd>
    </dl>
  </main>
</body>
</html>
